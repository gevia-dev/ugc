<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>video-workflow · beats</title>
<style>
/* ===========================================================================
   Design tokens — COPIADOS de content-chisel/src/index.css (modo claro).
   Nada aqui importa nem referencia aquele repo em runtime: são valores fixos.
   Parte 3 (página de assets): use estes mesmos tokens, não invente novos.
   =========================================================================== */
:root {
  /* base */
  --background: 0 0% 100%;
  --foreground: 0 0% 15%;
  --card: 0 0% 100%;
  --card-foreground: 0 0% 15%;

  /* primary: laranja Content Chisel */
  --primary: 13 99% 62%;
  --primary-foreground: 0 0% 100%;
  --primary-light: 13 99% 72%;
  --primary-dark: 13 99% 52%;
  --primary-hover: 13 99% 55%;

  --secondary: 0 0% 96%;
  --secondary-foreground: 0 0% 25%;
  --muted: 0 0% 96%;
  --muted-foreground: 0 0% 40%;
  --accent: 13 99% 75%;

  --success: 142 69% 58%;
  --warning: 38 92% 50%;
  --destructive: 0 84% 60%;

  --border: 0 0% 90%;
  --input: 0 0% 90%;
  --ring: 13 99% 62%;

  /* elevação em camadas */
  --shadow-elevation-1:
    0 1px 2px 0 hsl(240 15% 10% / 0.04),
    0 4px 8px -2px hsl(240 15% 10% / 0.06),
    0 16px 28px -12px hsl(240 20% 20% / 0.10);
  --shadow-elevation-2:
    0 2px 4px 0 hsl(240 15% 10% / 0.05),
    0 8px 16px -4px hsl(240 15% 10% / 0.08),
    0 24px 48px -16px hsl(240 20% 20% / 0.14);
  --shadow-inset-subtle: inset 0 1px 2px 0 hsl(240 15% 10% / 0.05);
  --shadow-elevation-1-depth:
    inset 0 1px 0 0 hsl(0 0% 100% / 1),
    inset 0 -3px 6px -1px hsl(240 20% 10% / 0.08),
    inset 0 -1px 0 0 hsl(240 20% 10% / 0.1),
    0 2px 4px 0 hsl(240 20% 10% / 0.06),
    0 12px 20px -4px hsl(var(--primary) / 0.06),
    0 32px 52px -16px hsl(var(--primary) / 0.1);
  --shadow-elevation-2-depth:
    inset 0 1px 0 0 hsl(0 0% 100% / 1),
    inset 0 -4px 8px -1px hsl(240 20% 10% / 0.1),
    inset 0 -1px 0 0 hsl(240 20% 10% / 0.12),
    0 3px 6px 0 hsl(240 20% 10% / 0.07),
    0 18px 28px -4px hsl(var(--primary) / 0.08),
    0 44px 68px -16px hsl(var(--primary) / 0.13);

  /* superfície da página */
  --home-surface-top: 30 25% 98.5%;
  --home-surface-bottom: 30 15% 96%;

  /* raios concêntricos (múltiplos de 4px) */
  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-3xl: 32px;
  --corner-shape: superellipse(1.5);
  --radius: var(--radius-md);

  --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-fast: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);

  --mono: ui-monospace, 'SFMono-Regular', 'Cascadia Mono', 'Consolas', monospace;
}

/* Cantos contínuos (Chromium 139+); outros motores caem no arco circular. */
.card, .btn, .pill, .field, .rail-seg, .chip, .frame-figure, .thumb, .topbar {
  corner-shape: var(--corner-shape);
}

* { box-sizing: border-box; }

/* App-shell de tela única: body é a coluna flex inteira, sem scroll de
   página — topbar/rail/footer têm altura fixa, o stage central ocupa o
   resto (flex:1) e só painéis internos (ver .beat-card) ganham overflow-y
   próprio como último recurso, para um beat com texto excepcionalmente
   longo não quebrar o layout. */
html, body { height: 100%; overflow: hidden; }

body {
  margin: 0;
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color: hsl(var(--foreground));
  background:
    linear-gradient(180deg, hsl(var(--home-surface-top)) 0%, hsl(var(--home-surface-bottom)) 100%)
    fixed;
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  line-height: 1.48;
  display: flex;
  flex-direction: column;
}

/* ---------------------------------------------------------------- topbar -- */
.topbar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 8px 20px;
  background: hsl(var(--background) / 0.82);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid hsl(var(--border));
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: var(--radius-md);
  corner-shape: var(--corner-shape);
  background: hsl(var(--primary));
  color: hsl(var(--primary-foreground));
  box-shadow: var(--shadow-elevation-1);
  flex: none;
}
.brand-mark svg { width: 18px; height: 18px; }
.brand-text { min-width: 0; }
.brand-title {
  font-weight: 650; font-size: 14px; letter-spacing: -0.01em;
  display: block; line-height: 1.2;
}
.brand-sub {
  font-size: 12px; color: hsl(var(--muted-foreground));
  font-family: var(--mono);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: block; max-width: 320px;
}
/* navegação: "← Projetos / campanha · #ordem · data" em cima, título humano embaixo */
a.brand-mark { text-decoration: none; }
a.brand-mark:hover { background: hsl(var(--primary-hover)); }
.crumbs { display: flex; align-items: baseline; gap: 6px; min-width: 0; font-size: 11.5px; line-height: 1.25; }
.crumb-home { flex: none; color: hsl(var(--primary-dark)); font-weight: 650; text-decoration: none; white-space: nowrap; }
.crumb-home:hover { text-decoration: underline; }
.crumbs .brand-sub { font-family: inherit; font-size: 11.5px; max-width: 300px; }
.crumbs .brand-sub::before { content: '/'; margin-right: 6px; color: hsl(var(--muted-foreground) / 0.6); }
.brand-title.project-title { max-width: 380px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .brand { flex: 0 1 auto; }
.topbar .tabs { flex: none; }
.tab { display: inline-flex; align-items: center; gap: 6px; font-family: inherit; }
.tab-n {
  width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center;
  font-size: 10px; font-weight: 700; background: hsl(var(--secondary)); color: hsl(var(--muted-foreground));
}
.tab.is-active .tab-n { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
/* progresso da revisão: barra aprovados/rejeitados/pendentes + texto */
.review-progress { display: inline-flex; align-items: center; gap: 8px; font-size: 11.5px; color: hsl(var(--muted-foreground)); white-space: nowrap; }
.review-progress[hidden] { display: none; }
.rp-bar { display: flex; gap: 1px; width: 92px; height: 7px; border-radius: 999px; overflow: hidden; background: hsl(var(--border)); flex: none; }
.rp-bar i { display: block; height: 100%; }
.rp-bar .rp-a { background: hsl(142 55% 45%); }
.rp-bar .rp-r { background: hsl(var(--destructive)); }
.rp-text b { color: hsl(var(--foreground)); font-weight: 650; }
.rp-text .rp-rej { color: hsl(0 60% 42%); font-weight: 600; }
.tabs { display: flex; gap: 4px; margin-left: 6px; }
.tab {
  font-size: 13px; font-weight: 550;
  padding: 7px 14px;
  border-radius: 999px; corner-shape: round;
  color: hsl(var(--muted-foreground));
  background: transparent; border: 1px solid transparent;
  cursor: pointer; text-decoration: none;
  transition: var(--transition-fast);
}
.tab:hover { background: hsl(var(--secondary)); color: hsl(var(--foreground)); }
.tab.is-active {
  background: hsl(var(--primary) / 0.1);
  color: hsl(var(--primary-dark));
  border-color: hsl(var(--primary) / 0.22);
}
.topbar-spacer { flex: 1; }

select.project-select {
  font: inherit; font-size: 13px;
  padding: 7px 12px;
  border-radius: var(--radius-sm); corner-shape: var(--corner-shape);
  border: 1px solid hsl(var(--input));
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  box-shadow: var(--shadow-inset-subtle);
  cursor: pointer;
  max-width: 210px;
}
select.project-select:focus-visible { outline: 2px solid hsl(var(--ring) / 0.5); outline-offset: 1px; }

.savestate {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12.5px; font-weight: 550;
  padding: 7px 14px;
  border-radius: 999px; corner-shape: round;
  border: 1px solid hsl(var(--border));
  background: hsl(var(--secondary));
  color: hsl(var(--muted-foreground));
  white-space: nowrap;
  transition: var(--transition-fast);
}
.savestate .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: hsl(var(--muted-foreground) / 0.5);
  flex: none;
}
.savestate[data-state="saving"] { border-color: hsl(var(--warning) / 0.35); background: hsl(var(--warning) / 0.1); color: hsl(38 70% 34%); }
.savestate[data-state="saving"] .dot { background: hsl(var(--warning)); animation: pulse 1s ease-in-out infinite; }
.savestate[data-state="saved"] { border-color: hsl(var(--success) / 0.35); background: hsl(var(--success) / 0.12); color: hsl(142 45% 28%); }
.savestate[data-state="saved"] .dot { background: hsl(var(--success)); }
.savestate[data-state="dirty"] { border-color: hsl(var(--primary) / 0.32); background: hsl(var(--primary) / 0.1); color: hsl(var(--primary-dark)); }
.savestate[data-state="dirty"] .dot { background: hsl(var(--primary)); }
.savestate[data-state="error"] { border-color: hsl(var(--destructive) / 0.4); background: hsl(var(--destructive) / 0.1); color: hsl(0 60% 38%); }
.savestate[data-state="error"] .dot { background: hsl(var(--destructive)); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

.review-counts {
  font-size: 11.5px; font-family: var(--mono);
  color: hsl(var(--muted-foreground));
  white-space: nowrap;
}
.btn-send {
  background: hsl(var(--primary) / 0.1); color: hsl(var(--primary-dark));
  border-color: hsl(var(--primary) / 0.32);
}
.btn-send:hover:not(:disabled) { background: hsl(var(--primary) / 0.18); color: hsl(var(--primary-dark)); }
.btn-send { white-space: nowrap; }
.btn-send svg { width: 13px; height: 13px; }

/* ------------------------------------------------------------------ rail -- */
.railwrap {
  flex: none;
  padding: 8px 20px 2px;
  max-width: 1560px; margin: 0 auto; width: 100%;
}
.rail { display: flex; gap: 12px; align-items: flex-end; }
.rail-chunk { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rail-chunk-label {
  font-size: 10px; font-weight: 650; letter-spacing: 0.07em; text-transform: uppercase;
  color: hsl(var(--muted-foreground));
  font-family: var(--mono);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rail-segs { display: flex; gap: 3px; }
.rail-seg {
  height: 22px; min-width: 18px;
  border: 1px solid hsl(var(--border));
  border-radius: var(--radius-xs);
  background: hsl(var(--background));
  box-shadow: var(--shadow-inset-subtle);
  cursor: pointer;
  display: grid; place-items: center;
  font-size: 10px; font-weight: 600; font-family: var(--mono);
  color: hsl(var(--muted-foreground));
  padding: 0 5px;
  transition: var(--transition-fast);
}
.rail-seg:hover { border-color: hsl(var(--primary) / 0.45); color: hsl(var(--primary-dark)); }
.rail-seg.is-active {
  background: hsl(var(--primary));
  border-color: hsl(var(--primary-dark));
  color: hsl(var(--primary-foreground));
  box-shadow: 0 2px 8px -1px hsl(var(--primary) / 0.45);
}

/* ----------------------------------------------------------------- stage -- */
.stage {
  max-width: 1560px; margin: 0 auto; width: 100%;
  padding: 10px 20px;
  display: grid;
  grid-template-columns: minmax(280px, 0.82fr) minmax(380px, 1.18fr);
  gap: 16px;
  align-items: stretch;
  flex: 1 1 auto;
  min-height: 0;
}
/* Abaixo de 1120px as duas colunas não cabem lado a lado E dentro da altura
   ao mesmo tempo — vira coluna única com scroll de página. É a única exceção
   deliberada à regra de "tela única": largura e altura não cabem juntas num
   viewport estreito, então priorizamos não cortar conteúdo. */
@media (max-width: 1120px) {
  html, body { overflow: auto; }
  .stage { grid-template-columns: 1fr; flex: none; }
}

.card {
  background: hsl(var(--card));
  color: hsl(var(--card-foreground));
  border: 1px solid hsl(var(--border));
  border-radius: var(--radius-2xl);
  box-shadow: var(--shadow-elevation-1-depth);
}

/* frame ------------------------------------------------------------------- */
.pane-frame { min-height: 0; display: flex; }
.frame-card { padding: 10px; display: flex; flex-direction: row; gap: 10px; width: 100%; min-height: 0; }
.frame-main { display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; min-height: 0; }
.frame-figure {
  position: relative;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background:
    repeating-conic-gradient(hsl(0 0% 97%) 0% 25%, hsl(0 0% 93%) 0% 50%) 50% / 18px 18px;
  border: 1px solid hsl(var(--border));
  display: grid; place-items: center;
  flex: 1 1 auto;
  min-height: 0;
}
.frame-figure img { display: block; width: 100%; height: 100%; object-fit: contain; }
.frame-empty {
  padding: 20px; text-align: center;
  color: hsl(var(--muted-foreground)); font-size: 13px;
}
.frame-badge {
  position: absolute; left: 10px; top: 10px;
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  padding: 5px 10px;
  border-radius: 999px; corner-shape: round;
  background: hsl(0 0% 8% / 0.68);
  color: hsl(0 0% 100%);
  backdrop-filter: blur(6px);
  letter-spacing: 0.01em;
}
.frame-meta {
  flex: none;
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding: 8px 2px 0;
}
.frame-meta .fm-name { font-family: var(--mono); font-size: 12px; font-weight: 600; }
.frame-meta .fm-sub { font-size: 11.5px; color: hsl(var(--muted-foreground)); }
#stripWrap {
  flex: none;
  width: 118px;
  display: flex; flex-direction: column; min-height: 0;
}
#stripWrap.hide { display: none; }
.strip {
  flex: 1 1 auto;
  display: flex; flex-direction: column; gap: 8px; padding: 6px 0 0;
  overflow-y: auto; overflow-x: hidden; min-height: 0;
}
.thumb {
  width: 100%; height: 72px; flex: none;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1.5px solid hsl(var(--border));
  background: hsl(var(--secondary));
  cursor: pointer; padding: 0;
  transition: var(--transition-fast);
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb:hover { border-color: hsl(var(--primary) / 0.5); }
.thumb.is-active { border-color: hsl(var(--primary)); box-shadow: 0 0 0 3px hsl(var(--primary) / 0.16); }
.strip-label {
  flex: none;
  font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
  color: hsl(var(--muted-foreground)); padding: 0 0 2px;
}

/* beat -------------------------------------------------------------------- */
.pane-beat { min-height: 0; display: flex; }
.beat-card {
  padding: 12px 16px 10px;
  width: 100%;
  display: flex;
  flex-direction: column;
  min-height: 0;
  /* último recurso: um beat com texto excepcionalmente longo em todos os
     campos ao mesmo tempo rola AQUI DENTRO, nunca a página inteira. */
  overflow-y: auto;
}
.beat-head { flex: none; border-bottom: 1px solid hsl(var(--border)); padding-bottom: 8px; margin-bottom: 8px; }
.beat-kicker { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.beat-counter {
  font-size: 17px; font-weight: 720; letter-spacing: -0.025em;
  color: hsl(var(--foreground));
}
.beat-counter em { font-style: normal; color: hsl(var(--primary)); }
.beat-counter .of { font-size: 14px; font-weight: 500; color: hsl(var(--muted-foreground)); }

.name-input {
  font: inherit;
  font-size: 16px; font-weight: 640; letter-spacing: -0.015em;
  width: 100%;
  padding: 5px 10px;
  margin-left: -10px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm); corner-shape: var(--corner-shape);
  background: transparent;
  color: hsl(var(--foreground));
  transition: var(--transition-fast);
}
.name-input:hover { background: hsl(var(--secondary) / 0.7); }
.name-input:focus { outline: none; background: hsl(var(--background)); border-color: hsl(var(--ring) / 0.5); box-shadow: 0 0 0 3px hsl(var(--ring) / 0.14); }

.field { margin-bottom: 0; min-width: 0; }
.field-head { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
.field-icon {
  width: 18px; height: 18px; flex: none;
  display: grid; place-items: center;
  border-radius: var(--radius-xs); corner-shape: var(--corner-shape);
  background: hsl(var(--primary) / 0.1);
  color: hsl(var(--primary-dark));
}
.field-icon svg { width: 11px; height: 11px; }
.field-label {
  font-size: 10.5px; font-weight: 680; letter-spacing: 0.07em; text-transform: uppercase;
  color: hsl(var(--secondary-foreground));
}
.field-hint { font-size: 10.5px; color: hsl(var(--muted-foreground)); margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.field-empty-tag {
  font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
  color: hsl(var(--muted-foreground));
  padding: 1px 6px; border-radius: var(--radius-xs); corner-shape: var(--corner-shape);
  background: hsl(var(--muted));
}

textarea.autotext {
  font: inherit;
  font-size: 13px; line-height: 1.48;
  width: 100%;
  min-height: 36px;
  max-height: 96px;
  padding: 7px 10px;
  resize: none; overflow-y: auto;
  border: 1px solid hsl(var(--input));
  border-radius: var(--radius-md); corner-shape: var(--corner-shape);
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  box-shadow: var(--shadow-inset-subtle);
  transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
}
textarea.autotext::placeholder { color: hsl(var(--muted-foreground) / 0.75); }
textarea.autotext:hover { border-color: hsl(0 0% 82%); }
textarea.autotext:focus {
  outline: none;
  border-color: hsl(var(--ring) / 0.65);
  box-shadow: 0 0 0 3px hsl(var(--ring) / 0.14), var(--shadow-inset-subtle);
}
textarea.autotext[data-dirty="1"] { border-color: hsl(var(--primary) / 0.55); background: hsl(var(--primary) / 0.03); }
textarea.autotext.mono { font-family: var(--mono); font-size: 13px; }

.desc-block { flex: none; margin-bottom: 8px; }
.desc-block textarea { background: hsl(var(--secondary) / 0.55); max-height: 108px; }

.grid-fields { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
@media (max-width: 1120px) { .grid-fields { grid-template-columns: 1fr; } }

/* review bar — aprovar / rejeitar + feedback deste beat -------------------- */
footer { flex: none; }
.reviewbar {
  display: flex; align-items: center; gap: 8px;
  max-width: 1560px; margin: 0 auto; width: 100%;
  padding: 7px 20px;
  border-top: 1px solid hsl(var(--border));
}
.review-status-pill {
  flex: none;
  font-size: 11px; font-weight: 650;
  padding: 6px 11px;
  border-radius: 999px; corner-shape: round;
  border: 1px solid hsl(var(--border));
  background: hsl(var(--secondary));
  color: hsl(var(--muted-foreground));
  display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.review-status-pill[data-decision="approved"] { background: hsl(var(--success) / 0.15); border-color: hsl(var(--success) / 0.4); color: hsl(142 45% 26%); }
.review-status-pill[data-decision="rejected"] { background: hsl(var(--destructive) / 0.12); border-color: hsl(var(--destructive) / 0.4); color: hsl(0 60% 40%); }
.review-undo {
  font: inherit; font-size: 10.5px; font-weight: 650;
  background: none; border: none; padding: 0; margin-left: 1px;
  color: inherit; text-decoration: underline; cursor: pointer; opacity: 0.75;
}
.review-undo:hover { opacity: 1; }
.feedback-input {
  flex: 1 1 auto; min-width: 0;
  font: inherit; font-size: 12.5px;
  padding: 7px 11px;
  border: 1px solid hsl(var(--input));
  border-radius: var(--radius-md); corner-shape: var(--corner-shape);
  background: hsl(var(--background));
  box-shadow: var(--shadow-inset-subtle);
  resize: none; max-height: 52px; overflow-y: auto;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.feedback-input::placeholder { color: hsl(var(--muted-foreground) / 0.75); }
.feedback-input:focus {
  outline: none; border-color: hsl(var(--ring) / 0.65);
  box-shadow: 0 0 0 3px hsl(var(--ring) / 0.14), var(--shadow-inset-subtle);
}
.feedback-input[data-dirty="1"] { border-color: hsl(var(--primary) / 0.5); }
.feedback-save {
  flex: none; width: 64px;
  font-size: 10px; color: hsl(var(--muted-foreground));
  text-align: center;
}
.btn-reject { border-color: hsl(var(--destructive) / 0.38); color: hsl(0 55% 42%); }
.btn-reject:hover:not(:disabled) { background: hsl(var(--destructive) / 0.08); border-color: hsl(var(--destructive) / 0.55); color: hsl(0 60% 36%); }
.btn-reject.is-active { background: hsl(var(--destructive) / 0.14); border-color: hsl(var(--destructive) / 0.5); color: hsl(0 60% 36%); }
.btn-approve { border-color: hsl(var(--success) / 0.4); color: hsl(142 45% 28%); }
.btn-approve:hover:not(:disabled) { background: hsl(var(--success) / 0.1); border-color: hsl(var(--success) / 0.55); color: hsl(142 50% 22%); }
.btn-approve.is-active { background: hsl(var(--success) / 0.16); border-color: hsl(var(--success) / 0.5); color: hsl(142 50% 22%); }

/* pager ------------------------------------------------------------------- */
.pager {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  padding: 4px 20px;
}
.btn {
  font: inherit; font-size: 13px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 15px;
  border-radius: var(--radius-lg); corner-shape: var(--corner-shape);
  border: 1px solid hsl(var(--border));
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  box-shadow: var(--shadow-elevation-1);
  cursor: pointer;
  transition: var(--transition-fast);
}
.btn:hover:not(:disabled) { border-color: hsl(var(--primary) / 0.4); color: hsl(var(--primary-dark)); transform: translateY(-1px); box-shadow: var(--shadow-elevation-2); }
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { opacity: 0.42; cursor: not-allowed; }
.btn svg { width: 14px; height: 14px; }
.btn-primary {
  background: hsl(var(--primary)); color: hsl(var(--primary-foreground));
  border-color: hsl(var(--primary-dark));
}
.btn-primary:hover:not(:disabled) { background: hsl(var(--primary-hover)); color: hsl(var(--primary-foreground)); }
.pager-dots { display: flex; gap: 6px; padding: 0 8px; }
.dot-nav {
  width: 8px; height: 8px; padding: 0;
  border-radius: 50%; corner-shape: round;
  border: 1px solid hsl(var(--border));
  background: hsl(var(--background));
  cursor: pointer;
  transition: var(--transition-fast);
}
.dot-nav:hover { border-color: hsl(var(--primary) / 0.6); }
.dot-nav.is-active { background: hsl(var(--primary)); border-color: hsl(var(--primary-dark)); transform: scale(1.35); }
.dot-nav[data-decision="approved"] { background: hsl(var(--success)); border-color: hsl(var(--success)); }
.dot-nav[data-decision="rejected"] { background: hsl(var(--destructive)); border-color: hsl(var(--destructive)); }

.kbd-hint {
  text-align: center; font-size: 10px; color: hsl(var(--muted-foreground));
  padding: 1px 20px 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
kbd {
  font-family: var(--mono); font-size: 9.5px;
  padding: 1px 5px; border-radius: var(--radius-xs); corner-shape: var(--corner-shape);
  border: 1px solid hsl(var(--border)); border-bottom-width: 2px;
  background: hsl(var(--background));
  color: hsl(var(--secondary-foreground));
}

/* toast — confirmação do "Enviar respostas" -------------------------------- */
.toast {
  position: fixed; top: 12px; left: 50%;
  transform: translateX(-50%) translateY(-10px);
  z-index: 100;
  max-width: 460px;
  background: hsl(0 0% 10%); color: hsl(0 0% 98%);
  padding: 12px 14px; border-radius: var(--radius-lg); corner-shape: var(--corner-shape);
  box-shadow: var(--shadow-elevation-2);
  font-size: 12.5px; line-height: 1.5;
  display: flex; align-items: flex-start; gap: 10px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
}
.toast.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.toast.is-error { background: hsl(0 62% 34%); }
.toast-body { flex: 1 1 auto; min-width: 0; }
.toast-title { font-weight: 650; margin-bottom: 2px; }
.toast-actions { display: flex; gap: 6px; margin-top: 8px; }
.toast-copy {
  font: inherit; font-size: 11.5px; font-weight: 600;
  background: hsl(0 0% 100% / 0.14); color: inherit; border: 1px solid hsl(0 0% 100% / 0.25);
  padding: 5px 10px; border-radius: var(--radius-sm); corner-shape: var(--corner-shape); cursor: pointer;
}
.toast-copy:hover { background: hsl(0 0% 100% / 0.22); }
.toast-close {
  flex: none; font: inherit; background: none; border: none;
  color: hsl(0 0% 100% / 0.6); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px;
}
.toast-close:hover { color: hsl(0 0% 100%); }

.boot {
  max-width: 560px; margin: 70px auto; padding: 28px;
  text-align: center; color: hsl(var(--muted-foreground));
}
.boot h1 { font-size: 16px; color: hsl(var(--foreground)); margin: 0 0 8px; }
.boot code { font-family: var(--mono); font-size: 12px; }
.boot .btn { margin-top: 14px; text-decoration: none; }
.hide { display: none !important; }
[hidden] { display: none !important; } /* .stage é grid: sem isto o atributo hidden não esconde */

/* celular: a topbar quebra em duas linhas e perde o que é atalho */
@media (max-width: 720px) {
  .topbar { flex-wrap: wrap; row-gap: 6px; padding: 8px 12px; gap: 10px; }
  .brand { flex: 1 1 100%; }
  .brand-title.project-title { max-width: none; }
  .crumbs .brand-sub { max-width: 58vw; }
  .tabs { margin-left: 0; }
  .tab { padding: 6px 10px; }
  select.project-select, .savestate, .kbd-hint { display: none; }
  .rp-text { display: none; }
  .btn-send { padding: 7px 9px; }
  .btn-send .send-label { display: none; }
  .review-progress { flex: 1; }
  .rp-bar { flex: 1; width: auto; }
  .railwrap { padding: 8px 12px 2px; overflow-x: auto; }
  .stage { padding: 10px 12px; }
  .reviewbar { flex-wrap: wrap; padding: 7px 12px; }
  .feedback-input { flex: 1 1 100%; order: 5; }
  .feedback-save { display: none; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <a class="brand-mark" href="/" title="Todos os projetos" aria-label="Todos os projetos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="5" width="14" height="14" rx="3"></rect>
        <path d="M16 10.5 22 7v10l-6-3.5z"></path>
      </svg>
    </a>
    <span class="brand-text">
      <span class="crumbs"><a class="crumb-home" href="/">← Projetos</a><span class="brand-sub" id="brandSub">carregando…</span></span>
      <strong class="brand-title project-title" id="projectTitle">video-workflow</strong>
    </span>
  </div>

  <nav class="tabs" aria-label="Etapas da revisão">
    <button class="tab" type="button" id="tabCopy" title="Ler a copy e as falas dos prompts (C)"><span class="tab-n">1</span>Copy</button>
    <a class="tab is-active" href="#" id="tabBeats" aria-current="page"><span class="tab-n">2</span>Beats</a>
    <a class="tab" href="assets.html" id="tabAssets"><span class="tab-n">3</span>Assets</a>

  <span class="topbar-spacer"></span>

  <span class="review-progress" id="reviewCounts" hidden></span>
  <button class="btn btn-send" id="submitReviewBtn" title="Salva o que estiver pendente e grava o envio (review/&lt;projeto&gt;.md) para o Claude ler na próxima conversa">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
    <span class="send-label">Enviar respostas</span>
  </button>

  <select class="project-select" id="projectSelect" aria-label="Trocar de projeto" title="Trocar de projeto"></select>
  <span class="savestate" id="saveState" data-state="idle"><span class="dot"></span><span id="saveText">pronto</span></span>
</header>

<div class="railwrap"><div class="rail" id="rail"></div></div>

<main class="stage" id="stage" hidden>
  <section class="pane pane-frame">
    <div class="card frame-card">
      <div class="frame-main">
        <div class="frame-figure" id="frameFigure"></div>
        <div class="frame-meta">
          <span class="fm-name" id="frameName">—</span>
          <span class="fm-sub" id="frameSub"></span>
        </div>
      </div>
      <div id="stripWrap" class="hide">
        <div class="strip-label">Frames no intervalo</div>
        <div class="strip" id="strip"></div>
      </div>
    </div>
  </section>

  <section class="pane pane-beat">
    <div class="card beat-card">
      <div class="beat-head">
        <div class="beat-kicker">
          <span class="beat-counter" id="beatCounter"></span>
        </div>
        <input class="name-input" id="beatName" data-key="name" placeholder="nome do beat" autocomplete="off" spellcheck="false">
      </div>

      <div class="desc-block">
        <div class="field-head">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          </span>
          <span class="field-label">Descrição do plano</span>
          <span class="field-hint">o que a cena faz neste beat</span>

        <textarea class="autotext" id="fDescription" data-key="description" rows="3" placeholder="sem descrição"></textarea>
      </div>

      <div class="grid-fields" id="fields"></div>

</main>

<footer>
  <div class="reviewbar">
    <span class="review-status-pill" id="reviewStatusPill" data-decision="">
      <span id="reviewStatusText">pendente</span>
      <button class="review-undo hide" id="reviewUndoBtn" type="button">desfazer</button>
    </span>
    <button class="btn btn-reject" id="rejectBtn" title="Rejeitar este beat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      Rejeitar
    </button>
    <textarea class="feedback-input" id="feedbackInput" rows="1" placeholder="feedback para este beat (opcional) — o que precisa mudar"></textarea>
    <span class="feedback-save" id="feedbackSave"></span>
    <button class="btn btn-approve" id="approveBtn" title="Aprovar este beat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      Aprovar
    </button>
  </div>
  <div class="pager">
    <button class="btn" id="prevBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Anterior
    </button>
    <div class="pager-dots" id="dots"></div>
    <button class="btn btn-primary" id="nextBtn">
      Próximo
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
  <div class="kbd-hint">
    <kbd>←</kbd> <kbd>→</kbd> navega · <kbd>Ctrl</kbd>+<kbd>S</kbd> salva · <kbd>A</kbd> aprova · <kbd>R</kbd> rejeita · <kbd>C</kbd> copy · campo salva sozinho ao perder o foco
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite">
  <div class="toast-body">
    <div class="toast-title" id="toastTitle"></div>
    <div id="toastMsg"></div>
    <div class="toast-actions">
      <button class="toast-copy" id="toastCopyBtn">copiar resumo</button>
    </div>
  </div>
  <button class="toast-close" id="toastCloseBtn" aria-label="Fechar">×</button>
</div>

<div class="boot" id="boot"><h1>Carregando projeto…</h1><p>Falando com <code>/api/projects</code>.</p></div>

<script src="common.js"></script>
<script>
'use strict';

/* ===========================================================================
   Estado e rotas
   - URL: #/<pastaDoProjeto>/<idDoBeat>   ex.: #/seedance-pizza-osmo/1.3
   - Toda leitura vem de GET /api/project?dir=… ; toda escrita vai em POST /api/beat.
   =========================================================================== */

const FIELDS = [
  { key: 'dialogue', label: 'Fala',   hint: 'o que é dito', icon: 'M21 12a8 8 0 0 1-8 8H7l-4 3v-5.5A8 8 0 0 1 13 4a8 8 0 0 1 8 8z' },
  { key: 'camera',   label: 'Câmera', hint: 'enquadramento e movimento', icon: 'M2 7h13v10H2zM15 11l7-4v10l-7-4z' },
  { key: 'sfx',      label: 'SFX',    hint: 'som e ruído', icon: 'M3 12h3l3-6v12l-3-6H3zM15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12' },
  { key: 'vfx',      label: 'VFX',    hint: 'efeito visual e grafismo', icon: 'M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM18.5 16l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z' },
];

const state = {
  projects: [],
  overview: null,      // GET /api/overview — títulos humanos/campanha (opcional: sem ele, usa a pasta)
  dir: null,
  project: null,
  beatId: null,
  pending: new Map(), // key -> valor ainda não salvo
  saving: 0,
  review: null,        // { version, project, updatedAt, submittedAt, beats: { <id>: {...} } }
  reviewCounts: null,  // { approved, rejected, withFeedback, total }
};
let lastSummaryText = '';

const $ = (id) => document.getElementById(id);

function fmtSec(s) {
  if (s == null) return '—';
  return s.toFixed(3).replace('.', ',') + 's';
}

function api(path, options) {
  return fetch(path, options).then(async (r) => {
    const data = await r.json().catch(() => ({ ok: false, error: 'resposta não-JSON' }));
    if (!r.ok || data.ok === false) throw new Error(data.error || ('erro ' + r.status));
    return data;
  });
}

/* --------------------------------------------------------------- savestate */
let saveTimer = null;
function setSave(stateName, text) {
  const el = $('saveState');
  el.dataset.state = stateName;
  $('saveText').textContent = text;
  clearTimeout(saveTimer);
  if (stateName === 'saved' || stateName === 'idle') {
    saveTimer = setTimeout(() => {
      if ($('saveState').dataset.state === stateName && state.pending.size === 0) {
        $('saveState').dataset.state = 'idle';
        $('saveText').textContent = 'tudo salvo';
      }
    }, 2600);
  }
}

/* ------------------------------------------------------------------ router */
function parseHash() {
  const raw = (location.hash || '').replace(/^#\/?/, '');
  const [dir, id] = raw.split('/');
  return { dir: dir || null, id: id ? decodeURIComponent(id) : null };
}

function goTo(dir, id, replace) {
  const hash = '#/' + dir + '/' + id;
  if (replace) location.replace(hash);
  else location.hash = hash;
}

/* ------------------------------------------------------------------- boot */
const HOME_LINK = '<a class="btn" href="/">← Voltar para os projetos</a>';

/** Mostra uma mensagem no lugar do palco (erro, projeto sem beats…). */
function showMessage(title, html) {
  $('stage').hidden = true;
  document.querySelector('body > footer').hidden = true;
  document.querySelector('.railwrap').hidden = true;
  $('reviewCounts').hidden = true;
  $('boot').hidden = false;
  $('boot').classList.remove('hide');
  $('boot').innerHTML = '<h1>' + escapeHtml(title) + '</h1><p>' + html + '</p>' + HOME_LINK;
}

function fillProjectSelect() {
  VW.fillProjectSelect($('projectSelect'), {
    dirs: state.projects.map((p) => p.dir),
    overview: state.overview,
    current: state.dir || parseHash().dir,
  });
}

async function boot() {
  // a entrada da UI é a home de projetos; ui.html sem projeto no hash volta pra lá
  if (!parseHash().dir) { location.replace('/'); return; }
  try {
    const [data, overview] = await Promise.all([
      api('/api/projects'),
      VW.loadOverview().catch(() => null),
    ]);
    state.projects = data.projects;
    state.overview = overview;
  } catch (err) {
    showMessage('Não consegui falar com o servidor', escapeHtml(err.message));
    return;
  }

  const sel = $('projectSelect');
  fillProjectSelect();
  sel.addEventListener('change', async () => {
    await flushPending();
    await saveFeedback();
    goTo(sel.value, '');
  });

  window.addEventListener('hashchange', onRoute);
  await onRoute();
}

async function onRoute() {
  const want = parseHash();
  if (!want.dir) { location.replace('/'); return; }
  let dir = want.dir;
  if (!state.projects.some((p) => p.dir === dir)) {
    // projeto criado depois que a página abriu (outros agentes escrevem em paralelo)
    try { state.projects = (await api('/api/projects')).projects; } catch { /* segue com a lista que tem */ }
    if (!state.projects.some((p) => p.dir === dir)) {
      showMessage('Projeto sem beats para revisar',
        '<code>' + escapeHtml(dir) + '</code> não existe ou ainda não tem <code>PROMPT_n_*.md</code>.');
      return;
    }
    fillProjectSelect();
  }

  if (dir !== state.dir || !state.project) {
    try {
      const [data] = await Promise.all([
        api('/api/project?dir=' + encodeURIComponent(dir)),
        loadReview(dir),
      ]);
      state.dir = dir;
      state.project = data.project;
      state.pending.clear();
    } catch (err) {
      showMessage('Erro ao ler o projeto', escapeHtml(err.message));
      return;
    }
  }

  const beats = state.project.beats;
  if (!beats.length) {
    // PROMPT_n existe mas nenhum beat foi reconhecido (ex.: arquivo sendo escrito agora)
    $('projectSelect').value = dir;
    renderHeader();
    showMessage('Nenhum beat reconhecido ainda',
      'Os <code>PROMPT_n</code> de <code>' + escapeHtml(dir) + '</code> ainda não têm um cabeçalho <code>**BEAT n — ini–fim — NOME**</code>. Recarregue quando os prompts estiverem prontos.');
    return;
  }
  let beat = beats.find((b) => b.id === want.id);
  if (!beat) {
    // aceita também o número global do beat (ex.: #/dir/3)
    const n = Number(want.id);
    if (Number.isInteger(n) && n >= 1 && n <= beats.length) beat = beats[n - 1];
  }
  if (!beat) {
    goTo(dir, beats[0].id, true);
    return;
  }

  state.beatId = beat.id;
  $('projectSelect').value = dir;
  $('boot').hidden = true;
  $('boot').classList.add('hide');
  $('stage').hidden = false;
  document.querySelector('body > footer').hidden = false;
  document.querySelector('.railwrap').hidden = false;
  render();
}

/* ----------------------------------------------------------------- reload */
async function reloadProject() {
  const data = await api('/api/project?dir=' + encodeURIComponent(state.dir));
  state.project = data.project;
}

/* ------------------------------------------------------------------ review */
async function loadReview(dir) {
  try {
    const data = await api('/api/review?dir=' + encodeURIComponent(dir));
    state.review = data.review;
    state.reviewCounts = data.counts;
  } catch {
    // projeto sem review/<dir>.json ainda, ou erro de rede — trata como "nada revisado".
    state.review = null;
    state.reviewCounts = null;
  }
}

/* ----------------------------------------------------------------- render */
function currentBeat() {
  return state.project.beats.find((b) => b.id === state.beatId) || null;
}

/** Resumo do projeto atual no /api/overview (título humano, campanha…), ou null. */
function projectSummary() {
  return VW.findByDir(state.overview, state.dir);
}

/** Cabeçalho: "← Projetos / campanha · #ordem · data" + título humano. */
function renderHeader() {
  const s = projectSummary();
  const m = s ? s.meta : {};
  const crumbs = [m.campaign, m.order != null ? '#' + m.order : null, m.publishDate ? VW.fmtDate(m.publishDate) : null].filter(Boolean);
  $('brandSub').textContent = crumbs.length ? crumbs.join(' · ') : state.dir;
  $('brandSub').title = state.dir;
  $('projectTitle').textContent = s ? s.title : state.dir;
  $('projectTitle').title = (s ? s.title + '\n' : '') + state.dir;
  $('tabAssets').href = 'assets.html#/' + encodeURIComponent(state.dir);
  // aba ativa aponta para o beat atual (um "#" vazio mandaria para a home)
  $('tabBeats').href = '#/' + encodeURIComponent(state.dir) + '/' + encodeURIComponent(state.beatId || '');
}

function render() {
  const p = state.project;
  const beat = currentBeat();
  if (!beat) return;

  const s = projectSummary();
  document.title = 'BEAT ' + beat.position + '/' + beat.total + ' · ' + (s ? s.title : p.dir);
  renderHeader();

  renderRail();
  renderFrame(beat);
  renderBeat(beat);
  renderPager(beat);
  renderReviewBar(beat);
}

function renderRail() {
  const p = state.project;
  const rail = $('rail');
  const total = (p.end ?? 1) - (p.start ?? 0) || 1;
  rail.innerHTML = p.chunks.map((chunk) => {
    const beats = p.beats.filter((b) => b.chunk === chunk.chunk);
    const span = beats.reduce((acc, b) => acc + (b.duration || 0), 0);
    const segs = beats.map((b) => {
      const active = b.id === state.beatId ? ' is-active' : '';
      const grow = Math.max(0.4, b.duration || 1);
      return '<button class="rail-seg' + active + '" style="flex:' + grow + ' 1 0" ' +
        'data-id="' + escapeHtml(b.id) + '" title="' + escapeHtml('BEAT ' + b.position + ' — ' + b.name) + '">' +
        b.position + '</button>';
    }).join('');
    return '<div class="rail-chunk" style="flex:' + Math.max(0.5, span) + ' 1 0">' +
      '<div class="rail-chunk-label">chunk ' + chunk.chunk + ' · ' + escapeHtml(chunk.name) + '</div>' +
      '<div class="rail-segs">' + segs + '</div></div>';
  }).join('');
  rail.querySelectorAll('.rail-seg').forEach((el) => {
    el.addEventListener('click', () => navigateTo(el.dataset.id));
  });
  void total;
}

let activeFrameName = null;

function renderFrame(beat) {
  const fig = $('frameFigure');
  const frames = beat.frames || [];
  const chosen = frames.find((f) => f.name === activeFrameName) || beat.frame;

  if (!chosen) {
    fig.innerHTML = '<div class="frame-empty">Nenhum frame do teardown cai no intervalo deste beat.</div>';
    $('frameName').textContent = '—';
    $('frameSub').textContent = '';
    $('stripWrap').classList.add('hide');
    return;
  }

  fig.innerHTML =
    '<img alt="frame ' + escapeHtml(chosen.name) + '" src="' + escapeHtml(chosen.url) + '">' +
    '<span class="frame-badge">' + fmtSec(chosen.t) + '</span>';
  $('frameName').textContent = chosen.name;
  $('frameSub').textContent = frames.length + ' frame' + (frames.length === 1 ? '' : 's') + ' no intervalo';

  if (frames.length > 1) {
    $('stripWrap').classList.remove('hide');
    $('strip').innerHTML = frames.map((f) =>
      '<button class="thumb' + (f.name === chosen.name ? ' is-active' : '') + '" data-name="' + escapeHtml(f.name) + '" ' +
      'title="' + escapeHtml(f.name + ' @ ' + fmtSec(f.t)) + '"><img alt="" src="' + escapeHtml(f.url) + '"></button>'
    ).join('');
    $('strip').querySelectorAll('.thumb').forEach((el) => {
      el.addEventListener('click', () => { activeFrameName = el.dataset.name; renderFrame(currentBeat()); });
    });
  } else {
    $('stripWrap').classList.add('hide');
  }
}

function renderBeat(beat) {
  $('beatCounter').innerHTML = 'BEAT <em>' + beat.position + '</em> <span class="of">de ' + beat.total + '</span>';

  bindValue($('beatName'), beat.name ?? '');
  bindValue($('fDescription'), beat.description ?? '');

  $('fields').innerHTML = FIELDS.map((f) => {
    const value = beat[f.key];
    const emptyTag = (value == null)
      ? '<span class="field-empty-tag">não planejado</span>' : '';
    return '<div class="field">' +
      '<div class="field-head">' +
        '<span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="' + f.icon + '"/></svg></span>' +
        '<label class="field-label" for="f_' + f.key + '">' + f.label + '</label>' +
        emptyTag +
        '<span class="field-hint">' + f.hint + '</span>' +
      '</div>' +
      '<textarea class="autotext" id="f_' + f.key + '" data-key="' + f.key + '" rows="1" placeholder="' + f.label + ' não planejada neste beat"></textarea>' +
    '</div>';
  }).join('');

  for (const f of FIELDS) bindValue($('f_' + f.key), beat[f.key] ?? '');
}

const ARROW_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';

function renderPager(beat) {
  const beats = state.project.beats;
  $('prevBtn').disabled = beat.position <= 1;

  // Depois da última página de beat vem a página de ASSETS.
  const isLast = beat.position >= beat.total;
  const next = $('nextBtn');
  next.disabled = false;
  next.dataset.target = isLast ? 'assets' : 'beat';
  next.innerHTML = (isLast ? 'Assets' : 'Próximo') + ' ' + ARROW_SVG;
  next.title = isLast ? 'Última página de beat — segue para a página de assets' : '';

  $('dots').innerHTML = beats.map((b) => {
    const rec = state.review ? state.review.beats[b.id] : null;
    const dec = rec ? rec.decision : null;
    const decLabel = dec === 'approved' ? ' — aprovado' : dec === 'rejected' ? ' — rejeitado' : '';
    return '<button class="dot-nav' + (b.id === state.beatId ? ' is-active' : '') + '" data-id="' + escapeHtml(b.id) + '" ' +
      (dec ? 'data-decision="' + dec + '" ' : '') +
      'title="' + escapeHtml('BEAT ' + b.position + ' — ' + b.name + decLabel) + '"></button>';
  }).join('');
  $('dots').querySelectorAll('.dot-nav').forEach((el) => {
    el.addEventListener('click', () => navigateTo(el.dataset.id));
  });
}

/* ------------------------------------------------------------------ review
   Aprovar/Rejeitar + feedback DESTE beat. Porta única de escrita: POST
   /api/review (decisão) e /api/review/clear (desfazer) — mesmo padrão da
   parte 3 para assets ("nunca reuso silencioso", aqui "nunca decisão sem
   clique"). O texto do feedback tem sua própria via, saveFeedback(), pra
   permitir anotar um beat sem necessariamente aprovar/rejeitar ainda. */

function renderReviewCounts() {
  const el = $('reviewCounts');
  if (!state.project || !state.project.beats.length) { el.hidden = true; return; }
  // conta só decisões de beats que existem hoje nos PROMPT_n (ids antigos não contam)
  const beats = state.project.beats;
  const recs = (state.review && state.review.beats) || {};
  const approved = beats.filter((b) => recs[b.id] && recs[b.id].decision === 'approved').length;
  const rejected = beats.filter((b) => recs[b.id] && recs[b.id].decision === 'rejected').length;
  const total = beats.length;
  const pending = Math.max(0, total - approved - rejected);
  el.hidden = false;
  el.title = approved + ' aprovado' + (approved === 1 ? '' : 's') + ' · ' +
    rejected + ' rejeitado' + (rejected === 1 ? '' : 's') + ' · ' +
    pending + ' pendente' + (pending === 1 ? '' : 's');
  el.innerHTML =
    '<span class="rp-bar" aria-hidden="true">' +
      (approved ? '<i class="rp-a" style="flex:' + approved + '"></i>' : '') +
      (rejected ? '<i class="rp-r" style="flex:' + rejected + '"></i>' : '') +
      (pending ? '<i style="flex:' + pending + '"></i>' : '') +
    '</span>' +
    '<span class="rp-text"><b>' + approved + '</b>/' + total + ' aprovados' +
      (rejected ? ' · <span class="rp-rej">' + rejected + ' rej.</span>' : '') +
    '</span>';
}

/* --------------------------------------------------------------- copy (1) */
function openCopy() {
  if (!state.dir || VW.doc.isOpen()) return;
  const s = projectSummary();
  const m = s ? s.meta : {};
  VW.doc.open({
    dir: state.dir,
    title: s ? s.title : state.dir,
    kicker: [m.campaign, m.order != null ? '#' + m.order : null, m.publishDate ? VW.fmtDate(m.publishDate) : null].filter(Boolean).join(' · ') || 'Leitura da copy',
    cta: null,
    onBeat: (id) => navigateTo(id),
  });
}
$('tabCopy').addEventListener('click', openCopy);

function renderReviewBar(beat) {
  const rec = state.review ? state.review.beats[beat.id] : null;
  const decision = rec ? rec.decision : null;

  $('reviewStatusPill').dataset.decision = decision || '';
  $('reviewStatusText').textContent =
    decision === 'approved' ? 'aprovado' : decision === 'rejected' ? 'rejeitado' : 'pendente';
  $('reviewUndoBtn').classList.toggle('hide', !decision);
  $('approveBtn').classList.toggle('is-active', decision === 'approved');
  $('rejectBtn').classList.toggle('is-active', decision === 'rejected');
  $('feedbackSave').textContent = '';

  bindFeedback($('feedbackInput'), (rec && rec.feedback) || '');
  renderReviewCounts();
}

function bindFeedback(el, value) {
  el.value = value;
  el.dataset.original = value;
  el.dataset.dirty = '0';
  autosize(el);
  if (el.dataset.bound === '1') return;
  el.dataset.bound = '1';
  el.addEventListener('input', () => {
    el.dataset.dirty = el.value !== el.dataset.original ? '1' : '0';
    autosize(el);
  });
  el.addEventListener('blur', () => { saveFeedback(); });
  el.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') { el.value = el.dataset.original; el.dataset.dirty = '0'; autosize(el); el.blur(); }
  });
}

/** Grava só o texto do feedback — não decide nada. No-op se nada mudou. */
async function saveFeedback() {
  const el = $('feedbackInput');
  if (!el || el.value === el.dataset.original) return;
  const beat = currentBeat();
  if (!beat) return;
  const rec = state.review ? state.review.beats[beat.id] : null;
  const decision = rec ? rec.decision : null;

  $('feedbackSave').textContent = 'salvando…';
  try {
    const body = { dir: state.dir, beatId: beat.id, feedback: el.value };
    if (decision) body.decision = decision; // preserva a decisão já tomada
    const data = await api('/api/review', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    state.review = data.review;
    state.reviewCounts = data.counts;
    el.dataset.original = el.value;
    el.dataset.dirty = '0';
    $('feedbackSave').textContent = 'salvo';
    renderReviewCounts();
    setTimeout(() => { if ($('feedbackSave').textContent === 'salvo') $('feedbackSave').textContent = ''; }, 1800);
  } catch (err) {
    $('feedbackSave').textContent = 'falhou';
  }
}

/** Aprovar/Rejeitar. Clicar na decisão já ativa DESFAZ (volta a pendente). */
async function setDecision(decision) {
  const beat = currentBeat();
  if (!beat) return;
  const rec = state.review ? state.review.beats[beat.id] : null;
  const already = rec && rec.decision === decision;
  try {
    let data;
    if (already) {
      data = await api('/api/review/clear', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dir: state.dir, beatId: beat.id }),
      });
    } else {
      data = await api('/api/review', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dir: state.dir, beatId: beat.id, decision, feedback: $('feedbackInput').value }),
      });
    }
    state.review = data.review;
    state.reviewCounts = data.counts;
    renderPager(beat);  // recolore o dot deste beat no pager
    renderReviewBar(beat);
  } catch (err) {
    $('feedbackSave').textContent = 'falhou: ' + err.message;
  }
}

$('approveBtn').addEventListener('mousedown', (ev) => ev.preventDefault()); // não tira foco do feedback -> sem corrida com o blur-save
$('rejectBtn').addEventListener('mousedown', (ev) => ev.preventDefault());
$('reviewUndoBtn').addEventListener('mousedown', (ev) => ev.preventDefault());
$('approveBtn').addEventListener('click', () => setDecision('approved'));
$('rejectBtn').addEventListener('click', () => setDecision('rejected'));
$('reviewUndoBtn').addEventListener('click', async () => {
  const beat = currentBeat();
  if (!beat) return;
  const data = await api('/api/review/clear', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ dir: state.dir, beatId: beat.id }),
  });
  state.review = data.review;
  state.reviewCounts = data.counts;
  renderPager(beat);
  renderReviewBar(beat);
});

/* ------------------------------------------------------------- "Enviar" */
let toastTimer = null;
function showToast({ title, message, copyText, isError }) {
  $('toastTitle').textContent = title;
  $('toastMsg').textContent = message;
  lastSummaryText = copyText || '';
  $('toastCopyBtn').style.display = copyText ? '' : 'none';
  $('toast').classList.toggle('is-error', Boolean(isError));
  $('toast').classList.add('is-visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('is-visible'), isError ? 7000 : 10000);
}
$('toastCopyBtn').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(lastSummaryText);
    $('toastCopyBtn').textContent = 'copiado!';
    setTimeout(() => { $('toastCopyBtn').textContent = 'copiar resumo'; }, 1500);
  } catch {
    // clipboard indisponível (contexto não seguro, permissão negada) — sem drama, o texto já está no toast.
  }
});
$('toastCloseBtn').addEventListener('click', () => {
  $('toast').classList.remove('is-visible');
  clearTimeout(toastTimer);
});

$('submitReviewBtn').addEventListener('click', async () => {
  const btn = $('submitReviewBtn');
  btn.disabled = true;
  try {
    await flushPending();
    await saveFeedback();
    const data = await api('/api/review/submit', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dir: state.dir }),
    });
    state.review = data.review;
    state.reviewCounts = data.counts;
    renderReviewCounts();
    const beat = currentBeat();
    if (beat) renderReviewBar(beat);
    const c = data.counts;
    showToast({
      title: 'Enviado ✓',
      message: c.approved + ' aprovado(s) · ' + c.rejected + ' rejeitado(s)' +
        (c.withFeedback ? ' · ' + c.withFeedback + ' com feedback' : '') +
        '. Peça ao Claude para continuar a partir daqui.',
      copyText: 'Revisão de "' + state.dir + '" enviada — ' + c.approved + ' aprovados, ' + c.rejected +
        ' rejeitados' + (c.withFeedback ? ', ' + c.withFeedback + ' com feedback' : '') +
        '. Continue a partir de ' + data.digestPath + '.',
    });
  } catch (err) {
    showToast({ title: 'Falha ao enviar', message: err.message, isError: true });
  } finally {
    btn.disabled = false;
  }
});

/* ------------------------------------------------------------ campos/save */
function bindValue(el, value) {
  if (!el) return;
  el.value = value;
  el.dataset.original = value;
  el.dataset.dirty = '0';
  if (el.tagName === 'TEXTAREA') autosize(el);
  if (el.dataset.bound === '1') return;
  el.dataset.bound = '1';
  el.addEventListener('input', () => {
    const dirty = el.value !== el.dataset.original;
    el.dataset.dirty = dirty ? '1' : '0';
    if (dirty) state.pending.set(el.dataset.key, el);
    else state.pending.delete(el.dataset.key);
    if (el.tagName === 'TEXTAREA') autosize(el);
    setSave(state.pending.size ? 'dirty' : 'idle', state.pending.size ? 'alterações não salvas' : 'tudo salvo');
  });
  el.addEventListener('blur', () => { saveField(el); });
  el.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') { el.value = el.dataset.original; el.dataset.dirty = '0'; state.pending.delete(el.dataset.key); autosize(el); el.blur(); }
  });
}

function autosize(el) {
  el.style.height = 'auto';
  el.style.height = (el.scrollHeight + 2) + 'px';
}

async function saveField(el) {
  if (!el || el.value === el.dataset.original) { state.pending.delete(el?.dataset.key); return; }
  const key = el.dataset.key;
  const raw = el.value;
  // campo rotulado vazio => null (remove a linha do markdown); nome/descrição vazios ficam string.
  const isLabelled = FIELDS.some((f) => f.key === key);
  const value = isLabelled && raw.trim() === '' ? null : raw;

  state.saving += 1;
  setSave('saving', 'salvando ' + key + '…');
  try {
    const data = await api('/api/beat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dir: state.dir, id: state.beatId, patch: { [key]: value } }),
    });
    el.dataset.original = raw;
    el.dataset.dirty = '0';
    state.pending.delete(key);
    if (data.beat) {
      const idx = state.project.beats.findIndex((b) => b.id === data.beat.id);
      if (idx >= 0) state.project.beats[idx] = data.beat;
    }
    setSave('saved', data.changed ? ('salvo: ' + data.changedKeys.join(', ')) : 'sem alterações');
  } catch (err) {
    setSave('error', 'falhou: ' + err.message);
  } finally {
    state.saving -= 1;
  }
}

async function flushPending() {
  const els = [...state.pending.values()];
  for (const el of els) await saveField(el);
}

/* ------------------------------------------------------------- navegação */
async function navigateTo(id) {
  if (id === state.beatId) return;
  await flushPending();
  await saveFeedback(); // não depende do blur: Alt+Seta pode navegar com o campo ainda focado
  activeFrameName = null;
  await reloadProject();
  goTo(state.dir, id);
}

/** Sai das páginas de beat para a página de assets do mesmo projeto. */
async function goAssets() {
  await flushPending();
  await saveFeedback();
  location.href = 'assets.html#/' + encodeURIComponent(state.dir);
}

async function step(delta) {
  const beat = currentBeat();
  if (!beat) return;
  const next = state.project.beats[beat.position - 1 + delta];
  if (next) { await navigateTo(next.id); return; }
  // passou da última página de beat -> assets
  if (delta > 0) await goAssets();
}

$('prevBtn').addEventListener('click', () => step(-1));
$('nextBtn').addEventListener('click', () => {
  if ($('nextBtn').dataset.target === 'assets') goAssets();
  else step(1);
});

document.addEventListener('keydown', (ev) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's') { ev.preventDefault(); flushPending(); saveFeedback(); return; }
  if (ev.altKey && ev.key === 'ArrowLeft') { ev.preventDefault(); step(-1); return; }
  if (ev.altKey && ev.key === 'ArrowRight') { ev.preventDefault(); step(1); return; }
  if (typing) return;
  if (ev.key === 'ArrowLeft') { ev.preventDefault(); step(-1); }
  if (ev.key === 'ArrowRight') { ev.preventDefault(); step(1); }
  if (ev.key.toLowerCase() === 'a') { ev.preventDefault(); setDecision('approved'); }
  if (ev.key.toLowerCase() === 'r') { ev.preventDefault(); setDecision('rejected'); }
  if (ev.key.toLowerCase() === 'c') { ev.preventDefault(); openCopy(); }
});

window.addEventListener('beforeunload', (ev) => {
  const feedbackDirty = $('feedbackInput')?.dataset.dirty === '1';
  if (state.pending.size || feedbackDirty) { ev.preventDefault(); ev.returnValue = ''; }
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

boot();
</script>
